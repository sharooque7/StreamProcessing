log4j.rootLogger=INFO, console

# Console output configuration
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss,SSS} %-5p %-40c - %m%n

# Reduce verbosity for Kafka Streams and Clients
log4j.logger.org.apache.kafka=INFO
log4j.logger.org.apache.kafka.streams=INFO
log4j.logger.org.apache.kafka.clients=INFO
